    <div class="container">

        <main class="main-content">
            <section class="main-section">

                    <div class="LyricText">
<div class="LyricCN">
						<p>
							春光撩我心弦<br>
							春霧繚繞淡淡似雲煙<br>
							相思　相怨　多惆悵<br>
							思君　戀君　輾轉長夜難眠</p>
						<p>
							窗外燈籠輕搖擺<br>
							今宵等君空對月喲　滿目淚<br>
							花扇也遮不住我爰的憔悴</p>
						<p>
							夜喲　溫柔的夜喲<br>
							燈光在水中璘璘珊珊<br>
							思君　戀君　到如今<br>
							又听那金絲鳥兒報春曉</p>
						<p>
							金釵為君戴<br>
							絲袖為君翩然舞喲　傷心淚<br>
							我願化做春天裏的花兒相伴</p>
						<p>
							風中楊柳萬千條<br>
							問君今往何處喲　思斷腸<br>
							我願化做輕風和你天涯相伴</p>
</div>
