<!DOCTYPE html> <!-- 声明文档类型为HTML5 -->

                    <div class="LyricText">
<p>窗を叩く雨　目が覺めた朝<br>
冬の小鳥や猫きおやすみ<br>
曇る硝子越しに<br>
そっと触れてみる<br>
頬を伝う涙　せつない…</p>
<p>※せまい籠の中の　私は小鳥ね<br>
　このままじゃ　何處へもいけないわ<br>
　戀を語り合ってる　女の子たちには<br>
　私のこの想い　小夜曲</p>
<p>壁にかけたまま　真新しい制服<br>
冬の空に傾ぐ　オリオソ座<br>
ミラーシェイド越しに<br>
微笑むあなた<br>
頬を伝う涙　せつない…</p>
<p>※くりかえし</p>
<p>※くりかえし</p>
<p>岬まで飛んで行きたいな</p>                    </div>

                    <hr class="LyricFootRule">

                    <div class="LyricBack"><a href="0-elf-index.html">← 曲目一覧</a></div>
