<!DOCTYPE html> <!-- 声明文档类型为HTML5 -->

            .then(response => response.text())
            .then(data => { document.getElementById('footer-container').innerHTML = data; });

    <div class="container">
        <div id="header-container"></div>

        <main class="main-content">
            <section class="main-section">
                <div class="LyricBody"> <!-- 歌词正文：整块居中，内部文字左对齐 -->

                    <hr class="LyricDivider">

                    <div class="LyricPerformer">佐藤朱美</div>

                    <div class="LyricText">
						<p>
							その昔　信じられていた<br>
							美貌に宿る　邪悪な魂(こころ)<br>
							秘めやかに　そして冷ややかに<br>
							夜ごとに起こる惨劇</p>

							若く汚れのない血の香(か)を求めさまよう魔の手</p>

							残酷な快楽の中で<br>
							生贄の血に酔いしれてゆく<br>

							夜ごとに起こる惨劇</p>
						<p>
							気をつけなさい<br>
							月のない夜は</p>

							決して近づいてはいけない　二度と戻れはしない</p>

							秘めやかに　そして冷ややかに<br>
							幕を降ろした惨劇<br>
							震えて. . .<br>
