<!DOCTYPE html> <!-- 声明文档类型为HTML5 -->

<body>
    <script>
        fetch('/components/header.html')
            .then(response => response.text())
            .then(data => { document.getElementById('header-container').innerHTML = data; });
        fetch('/components/footer.html')
            .then(response => response.text())
            .then(data => { document.getElementById('footer-container').innerHTML = data; });
    </script>

    <div class="container">
        <div id="header-container"></div>

        <main class="main-content">
            <section class="main-section">
                <div class="LyricBody"> <!-- 歌词正文：整块居中，内部文字左对齐 -->
                    <div class="LyricProvenance">「めぞん一刻」エンディング・テーマ(1987)</div>

                    <div class="LyricTitle">サヨナラの素描</div>
                    <hr class="LyricDivider">

                    <div class="LyricPerformer">ピカソ</div>
                    <div class="LyricStaff">作詞：森　雪之丞<br>作曲：ピカソ<br>編曲：森　英治</div>

                    <div class="LyricText">
						<p>
							夜明けのガードレールに<br>
							二人腰掛け<br>
							ビルから憂鬱そうに<br>
							昇る朝陽　見る</p>
						<p>
							出逢ったダンスホールや<br>
							キスした路地を<br>
							今まで探したのさ<br>
							愛の落とし場所</p>
						<p>
							※なぜ…今…君…風…<br>
							　瞳と…瞳で…ただ…サヨナラ<br>
							　なぜ…今…僕…雨…<br>
							　ふと…胸…夢…濡れて光る</p>
						<p>
							舗道の向こう側で恋人達が<br>
							昔の二人まねて　頬を寄せている</p>
						<p>
							なぜ…今…君…風…<br>
							指…髪…もう…遠くて<br>
							なぜ…今…僕…雨…<br>
							目を…ふせ…君…見送るだけ</p>
						<p>
							※くりかえし</p>

                    <hr class="LyricFootRule">

                    <div class="LyricBack"><a href="0-ikkoku-index.html">← 曲目一覧</a></div>
