    <div class="container">

                    <div class="LyricText">
						<p>
							好きさ　痺れるほど<br>
							好きさ　悔しいほど<br>
							恐れる物は　何もない<br>
							好きさ　忘れられない</p>
						<p>
							きりがない　甘いくちずけを<br>

							好きさ　痺れるほど<br>
							好きさ　悔しいほど<br>
							思いつめれば　狂いそう<br>
							好きさ　離したくない</p>
						<p>
							帰れない　あなたの肌にも<br>
							夜が忍び込んで<br>
							仕方ない　別れまぎわにわ<br>
							無傷じゃいられない</p>
						<p>
							憎めない　冷たいしぐさわ<br>
							会えないと辛くて<br>
							やるせないあなたのその声<br>
							心がこわれそう</p>
						<p>
							好きさ<br>
							好きさ</p>
