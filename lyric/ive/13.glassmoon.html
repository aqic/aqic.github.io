<!DOCTYPE html> <!-- 声明文档类型为HTML5 -->
<html lang="ja"> <!-- HTML根元素，设置语言为日文 -->
<head>
    <meta charset="UTF-8"> <!-- 设置字符编码为UTF-8 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- 响应式视口设置 -->
    <title>ガラスの月 - I've</title> <!-- 页面标题 -->
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/lyric/lyric.css?v=14">
    <link rel="icon" href="/image/logo.webp" type="image">
</head>

<body>
    <script>
        fetch('/components/header.html')
            .then(response => response.text())
            .then(data => { document.getElementById('header-container').innerHTML = data; });
        fetch('/components/footer.html')
            .then(response => response.text())
            .then(data => { document.getElementById('footer-container').innerHTML = data; });
    </script>

    <div class="container">
        <div id="header-container"></div>

        <main class="main-content">
            <section class="main-section">
                <div class="LyricBody"> <!-- 歌词正文：整块居中，内部文字左对齐 -->
                    <div class="LyricProvenance">DAWN*SLAVE</div>

                    <div class="LyricTitle">ガラスの月</div>
                    <hr class="LyricDivider">

                    <div class="LyricPerformer">島宮えい子</div>
                    <div class="LyricStaff">作詞：SAYUMI<br>作・編曲：中沢伴行</div>

                    <div class="LyricText">
						<p>
							星が眠る窓から<br>
							夜明け探すの<br>
							ガラス細工の三日月<br>
							地平線</p>
						<p>
							明かりに溶ける空がまどろむ<br>
							昨日の余韻残して見つめる</p>
						<p>
							離れてても<br>
							いつかは巡り逢えるね<br>
							すれ違っても感じる　振返る</p>
						<p>
							淋しさだけが心　消えない<br>
							瞳閉じたら　あなたが微笑む</p>
						<p>
							※透き通る何もかもが<br>
							　さまよう魔法　消える<br>
							　扉の向こう側に広がる夢<br>
							　忘れないで</p>
						<p>
							悲しさだけが予感<br>
							消せない<br>
							耳をすませば<br>
							あなたが囁く</p>
						<p>
							失くせない強がっても<br>
							流した涙　残る<br>
							季節の向こう側に信じる夢<br>
							思い出して</p>
						<p>
							※繰り返し</p>
                    </div>

                    <hr class="LyricFootRule">

                    <div class="LyricBack"><a href="0-ive-index.html">← 曲目一覧</a></div>
                </div>
            </section>
        </main>

        <div id="footer-container"></div>
    </div>

</body>
</html>
