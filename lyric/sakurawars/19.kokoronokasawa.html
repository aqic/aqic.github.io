<!DOCTYPE html> <!-- 声明文档类型为HTML5 -->

    <title>心の傘は - サクラ大戦</title> <!-- 页面标题 -->

    <link rel="stylesheet" href="/lyric/lyric.css?v=14">
    <link rel="icon" href="/image/logo.webp" type="image">

<body>
    <script>
        fetch('/components/header.html')
            .then(response => response.text())
            .then(data => { document.getElementById('header-container').innerHTML = data; });
        fetch('/components/footer.html')
            .then(response => response.text())
            .then(data => { document.getElementById('footer-container').innerHTML = data; });
    </script>

    <div class="container">
        <div id="header-container"></div>

        <main class="main-content">
            <section class="main-section">
                <div class="LyricBody"> <!-- 歌词正文：整块居中，内部文字左对齐 -->
                    <div class="LyricProvenance">「サクラ大戦3」挿入歌</div>

                    <div class="LyricTitle">心の傘は</div>
                    <hr class="LyricDivider">

                    <div class="LyricPerformer">鷹森淑乃</div>
                    <div class="LyricStaff">作詞：広井王子<br>作曲：田中公平<br>編曲：浜口史郎</div>

                    <div class="LyricText">
						<p>
							街の色が　雨に濡れて　ジュブナエルの　夢が消えた<br>
							物語に恋した　わたしはいない<br>
							海の色が　霧に霞み　ボンボヤージュ　愛が消えた<br>
							もう何も見えなくて　わたしは泣いた<br>
							置き去りになった過去　心の傘は誰が差してくれるの<br>
							忘れられないあなたを</p>
						<p>
							橋の下を　川が流れ　メランコリー　月が滲む<br>
							語る言葉忘れた　わたしは沈む<br>
							橋の上を　人が流れ　アデュー・ア・トワ　星が滲む<br>
							語り合う恋人を　わたしは見てる<br>
							いつの日か救われる　心の傘は誰が差してくれるの<br>
							出会えるはずねあなたに</p>
                    </div>

                    <hr class="LyricFootRule">

                    <div class="LyricBack"><a href="0-sakurawars-index.html">← 曲目一覧</a></div>

        <div id="footer-container"></div>
