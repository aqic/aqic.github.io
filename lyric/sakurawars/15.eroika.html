    <script>

            .then(response => response.text())

            .then(response => response.text())
            .then(data => { document.getElementById('footer-container').innerHTML = data; });

    <div class="container">
        <div id="header-container"></div>

        <main class="main-content">

                    <hr class="LyricDivider">

                    <div class="LyricText">
						<p>
							運命が揺れ動くとき　世界が変わる<br>
							新しいスターが生まれ　世界を変える</p>
						<p>
							人の価値も未来も夢も　千年の時を<br>
							越えて変える英雄<br>
							運命という名の十字架を背負う者<br>
							あー　エロイカ</p>

							輝ける天の星座を　その身にまとい<br>

							永遠に燃える理想をかかげ　千年の時を<br>
							翔(かけ)て生きる英雄<br>

							あー　エロイカ</p>

                    <hr class="LyricFootRule">
