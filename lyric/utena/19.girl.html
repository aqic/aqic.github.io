<!DOCTYPE html> <!-- 声明文档类型为HTML5 -->
<html lang="ja"> <!-- HTML根元素，设置语言为日文 -->
<head>

    <title>女の子の季節 - 少女革命ウテナ</title> <!-- 页面标题 -->

    <link rel="icon" href="/image/logo.webp" type="image">
</head>

<body>
    <script>
        fetch('/components/header.html')
            .then(response => response.text())
            .then(data => { document.getElementById('header-container').innerHTML = data; });
        fetch('/components/footer.html')
            .then(response => response.text())
            .then(data => { document.getElementById('footer-container').innerHTML = data; });
    </script>

    <div class="container">
        <div id="header-container"></div>

        <main class="main-content">
            <section class="main-section">
                <div class="LyricBody"> <!-- 歌词正文：整块居中，内部文字左对齐 -->
                    <div class="LyricProvenance">「少女革命ウテナ」</div>

                    <div class="LyricTitle">女の子の季節</div>
                    <hr class="LyricDivider">

                    <div class="LyricPerformer">Kanna</div>

                    <div class="LyricText">
						<p>
							女の子のペットは<br>
							シャム猫かマルチーズ<br>
							いくつも巻き毛に　リボンを飾り<br>
							抱き締め頬ずり　ラブリー</p>
						<p>
							女の子の夢は　すてきな彼とデート<br>
							二人で映画や　食事に行くの<br>
							腕組み甘えて　ロマンティック</p>
						<p>
							いつか誰でも　大人になるわ<br>
							それまで許してね　女の子の季節<br>
							きっといつかは　大人になるわ<br>
							だけどそれまで　女の子の季節</p>
						<p>
							きれいと言われたい<br>
							可愛いと言われたい<br>
							愛してると言われたい<br>
							だって　それが　女の子の季節</p>
                    </div>

                    <hr class="LyricFootRule">

                    <div class="LyricBack"><a href="0-utena-index.html">← 曲目一覧</a></div>

        <div id="footer-container"></div>
