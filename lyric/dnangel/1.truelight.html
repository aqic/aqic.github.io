<!DOCTYPE html> <!-- 声明文档类型为HTML5 -->
<html lang="ja"> <!-- HTML根元素，设置语言为日文 -->
<head>
    <meta charset="UTF-8"> <!-- 设置字符编码为UTF-8 -->

    <title>白夜 - D・N・ANGEL</title> <!-- 页面标题 -->
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/lyric/lyric.css?v=14">
    <link rel="icon" href="/image/logo.webp" type="image">
</head>

<body>
    <script>
        fetch('/components/header.html')
            .then(response => response.text())
            .then(data => { document.getElementById('header-container').innerHTML = data; });
        fetch('/components/footer.html')
            .then(response => response.text())
            .then(data => { document.getElementById('footer-container').innerHTML = data; });
    </script>

    <div class="container">
        <div id="header-container"></div>

        <main class="main-content">
            <section class="main-section">
                <div class="LyricBody"> <!-- 歌词正文：整块居中，内部文字左对齐 -->
                    <div class="LyricTitle">白夜</div>
                    <hr class="LyricDivider">

                    <div class="LyricPerformer">宮本駿一</div>
                    <div class="LyricStaff">作詞︰酒井ミキオ<br>作曲︰山崎ますみ<br>編曲︰永井ルイ</div>

                    <div class="LyricText">
						<p>
							哀しいほど光りだした<br>
							白い闇切り裂く翼になれ<br>
							冷たい太陽に照らされてた<br>
							飼い馴らされた自由があった<br>
							鏡に映った奇跡の夜<br>
							仮面を外し始めた my soul</p>
						<p>
							崩れてゆく壁の向こうは<br>
							絶望も希望も同じ顔する<br>
							滿たされない心あるなら<br>
							飛びたてる週末のプロローグへ…</p>
						<p>
							刃のような風吹く世界<br>
							守るべきものは何なのか？<br>
							ひとつひとつ痛みを知るたび<br>
							本当の自分へと近づく</p>
						<p>
							消えゆく Fake Light<br>
							生まれゆく True Light<br>
							この手に…</p>
                    </div>

                    <hr class="LyricFootRule">

                    <div class="LyricBack"><a href="0-dnangel-index.html">← 曲目一覧</a></div>
                </div>
            </section>
        </main>

        <div id="footer-container"></div>
    </div>

</body>
</html>
