<!DOCTYPE html> <!-- 声明文档类型为HTML5 -->

    <script>

						<p>
							遥かな星空に　夢はまだ見えますか<br>
							幼いあの日より　鮮やかですか</p>
						<p>
							胸にあふれて　募る想い<br>

							　強く信じてた<br>

							※繰り返し</p>

							☆繰り返し</p>

                    <hr class="LyricFootRule">

                    <div class="LyricBack"><a href="0-ceres-index.html">← 曲目一覧</a></div>
