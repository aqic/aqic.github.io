<!DOCTYPE html> <!-- 声明文档类型为HTML5 -->
<html lang="ja"> <!-- HTML根元素，设置语言为日文 -->
<head>
    <meta charset="UTF-8"> <!-- 设置字符编码为UTF-8 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- 响应式视口设置 -->
    <title>Lyrics</title> <!-- 页面标题 -->
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/lyric/lyric.css?v=14">
    <link rel="stylesheet" href="/lyric/index.css?v=6">
    <link rel="icon" href="/image/logo.webp" type="image">
</head>

<body>
    <script>
        fetch('/components/header.html')
            .then(response => response.text())
            .then(data => { document.getElementById('header-container').innerHTML = data; });
        fetch('/components/footer.html')
            .then(response => response.text())
            .then(data => { document.getElementById('footer-container').innerHTML = data; });
    </script>

    <div class="container">
        <div id="header-container"></div>

        <main class="main-content">
            <section class="main-section">
                <div style="margin:20px;">
                    <div class="LyricCatalog catalog-head"><span class="jp">天上天下</span></div>
                    <hr style="margin:20px 0; border-top:1px solid #E6D8AE;">

					<div class="disc-head"><span class="disc-name">天上天下</span><span class="disc-sub">2 曲</span></div>
					<ul class="song-list">
						<li class="LyricItem"><a href="1.bombahead.html">《Bomb A Head! V》</a></li>
						<li class="LyricItem"><a href="2.aishitenemotto.html">《愛してね☆もっと》</a></li>
					</ul>

                    <hr style="margin:20px 0; border-top:1px solid #E6D8AE;">

                    <div class="LyricBack"><a href="../fullindex.html">← 曲目一覧</a></div>
                </div>
            </section>
        </main>

        <div id="footer-container"></div>
    </div>

</body>
</html>
