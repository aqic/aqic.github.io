<!DOCTYPE html> <!-- 声明文档类型为HTML5 -->

    <div class="container">

        <main class="main-content">

                    <div class="LyricText">
						<p>
							ひとつずつ窓辺から<br>

						<p>
							頬づえをつきながら<br>

							やさしさに手を引かれ<br>
							人は誰でも<br>
