<!DOCTYPE html> <!-- 声明文档类型为HTML5 -->
<html lang="ja"> <!-- HTML根元素，设置语言为日文 -->
<head>
    <meta charset="UTF-8"> <!-- 设置字符编码为UTF-8 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- 响应式视口设置 -->
    <title>海になれたら - スタジオジブリ</title> <!-- 页面标题 -->
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/lyric/lyric.css?v=14">
    <link rel="icon" href="/image/logo.webp" type="image">
</head>

<body>
    <script>
        fetch('/components/header.html')
            .then(response => response.text())
            .then(data => { document.getElementById('header-container').innerHTML = data; });
        fetch('/components/footer.html')
            .then(response => response.text())
            .then(data => { document.getElementById('footer-container').innerHTML = data; });
    </script>

    <div class="container">
        <div id="header-container"></div>

        <main class="main-content">
            <section class="main-section">
                <div class="LyricBody"> <!-- 歌词正文：整块居中，内部文字左对齐 -->
                    <div class="LyricProvenance">海がきこえる</div>

                    <div class="LyricTitle">海になれたら</div>
                    <hr class="LyricDivider">

                    <div class="LyricPerformer">坂本 洋子</div>
                    <div class="LyricStaff">作詞：望月 智充<br>作曲：永田 茂</div>

                    <div class="LyricText">
						<p>
							真っ白な夢　目覚めて気づいた<br>
							誰もいない波間に<br>
							ゆっくりと身を任せてただよえば<br>
							思うままの私になれる</p>
						<p>
							傷つかず強がりもせずに<br>
							おだやかな海になれたら<br>
							いつかきみに好きと告げるよ</p>
						<p>
							言葉にする気持ちもわからずに<br>
							部屋で泣いていた<br>
							私にさよなら　Ｇｏｏｄ　Ｂｙｅ</p>
						<p>
							飛ぶ鳥のようにかわらない<br>
							あたたかな海になれたら<br>
							どんなときも会いに行けるよ</p>
						<p>
							遠すぎた道　灯りをありがとう<br>
							ひざを抱いていた<br>
							時間にさよなら　Ｇｏｏｄ　Ｂｙｅ</p>
                    </div>

                    <hr class="LyricFootRule">

                    <div class="LyricBack"><a href="0-ghibli-index.html">← 曲目一覧</a></div>
                </div>
            </section>
        </main>

        <div id="footer-container"></div>
    </div>

</body>
</html>
