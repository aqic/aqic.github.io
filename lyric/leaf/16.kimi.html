<!DOCTYPE html> <!-- 声明文档类型为HTML5 -->
<html lang="ja"> <!-- HTML根元素，设置语言为日文 -->
<head>
    <meta charset="UTF-8"> <!-- 设置字符编码为UTF-8 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- 响应式视口设置 -->
    <title>君のままで - Leaf</title> <!-- 页面标题 -->
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/lyric/lyric.css?v=14">
    <link rel="icon" href="/image/logo.webp" type="image">
</head>

<body>
    <script>
        fetch('/components/header.html')
            .then(response => response.text())
            .then(data => { document.getElementById('header-container').innerHTML = data; });
        fetch('/components/footer.html')
            .then(response => response.text())
            .then(data => { document.getElementById('footer-container').innerHTML = data; });
    </script>

    <div class="container">
        <div id="header-container"></div>

        <main class="main-content">
            <section class="main-section">
                <div class="LyricBody"> <!-- 歌词正文：整块居中，内部文字左对齐 -->
                    <div class="LyricProvenance">こみっくパーティー</div>

                    <div class="LyricTitle">君のままで</div>
                    <hr class="LyricDivider">

                    <div class="LyricPerformer">元田恵美</div>
                    <div class="LyricStaff">作詞：須谷尚子<br>作曲：中上和英<br>编曲：豆田将</div>

                    <div class="LyricText">
						<p>
							君のままで変わらないで　誰よりも大切な<br>
							大きな夢輝かせた　ただひとりの友達</p>
						<p>
							何をしても伝わらず　上手くいかないばかりで<br>
							わたしだって誰だって　あたりまえにあること</p>
						<p>
							ムネのなかに帰らない　想いも言葉もいつか<br>
							時間がたてば戻ってくるから　しらないうちに</p>
						<p>
							いま君が　できることはひとつ<br>
							そのまま受けいれてゆこう<br>
							君のままでいつわらずに　少しひとやすみして<br>
							あせるきもち苦しいこと　君のパワーにかえて<br>
							君のままで変わらないで　誰よりも大切な<br>
							大きな夢輝かせた　ただひとりの友達</p>
                    </div>

                    <hr class="LyricFootRule">

                    <div class="LyricBack"><a href="0-leaf-index.html">← 曲目一覧</a></div>
                </div>
            </section>
        </main>

        <div id="footer-container"></div>
    </div>

</body>
</html>
