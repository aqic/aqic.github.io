<!DOCTYPE html> <!-- 声明文档类型为HTML5 -->
<html lang="ja"> <!-- HTML根元素，设置语言为日文 -->
<head>
    <meta charset="UTF-8"> <!-- 设置字符编码为UTF-8 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- 响应式视口设置 -->
    <title>今はおやすみ - 機動戦士ガンダム</title> <!-- 页面标题 -->
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/lyric/lyric.css?v=14">
    <link rel="icon" href="/image/logo.webp" type="image">
</head>

<body>
    <script>
        fetch('/components/header.html')
            .then(response => response.text())
            .then(data => { document.getElementById('header-container').innerHTML = data; });
        fetch('/components/footer.html')
            .then(response => response.text())
            .then(data => { document.getElementById('footer-container').innerHTML = data; });
    </script>

    <div class="container">
        <div id="header-container"></div>

        <main class="main-content">
            <section class="main-section">
                <div class="LyricBody"> <!-- 歌词正文：整块居中，内部文字左对齐 -->
                    <div class="LyricProvenance">テレビ「機動戦士ガンダム」挿入歌(1980)</div>

                    <div class="LyricTitle">今はおやすみ</div>
                    <hr class="LyricDivider">

                    <div class="LyricPerformer">戸田恵子</div>
                    <div class="LyricStaff">作詞：井萩麟<br>作曲：渡辺岳夫<br>編曲：松本祐士</div>

                    <div class="LyricText">
						<p>
							翼をひろげて　あなたを待つわ<br>
							きょうのあなたは辛いのかしら<br>
							そんなことない　わたしたち<br>
							だからねぇ　おやすみアムロ<br>
							こんな時代と人はいう<br>
							このぬくもりが確かなら　確かなら<br>
							見つかるよ　夢　それは夢　夢</p>
						<p>
							翼をひろげて　あなたを抱くわ<br>
							あしたあなたは寂しいかしら<br>
							そんなことない　わたしたち<br>
							だからねぇ　おやすみアムロ<br>
							こんな二人が巣立つとも<br>
							この悲しみが果てなくて　果てなくて<br>
							あこがれる　夢　それは夢　夢</p>
						<p>
							あした二人は血みどろで<br>
							風に　風に　風に舞う</p>
                    </div>

                    <hr class="LyricFootRule">

                    <div class="LyricBack"><a href="0-gundam-index.html">← 曲目一覧</a></div>
                </div>
            </section>
        </main>

        <div id="footer-container"></div>
    </div>

</body>
</html>
