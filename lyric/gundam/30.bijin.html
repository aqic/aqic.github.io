<!DOCTYPE html> <!-- 声明文档类型为HTML5 -->
<html lang="ja"> <!-- HTML根元素，设置语言为日文 -->
<head>
    <meta charset="UTF-8"> <!-- 设置字符编码为UTF-8 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- 响应式视口设置 -->
    <title>月下美人 - 機動戦士ガンダム</title> <!-- 页面标题 -->
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/lyric/lyric.css?v=14">
    <link rel="icon" href="/image/logo.webp" type="image">
</head>

<body>
    <script>
        fetch('/components/header.html')
            .then(response => response.text())
            .then(data => { document.getElementById('header-container').innerHTML = data; });
        fetch('/components/footer.html')
            .then(response => response.text())
            .then(data => { document.getElementById('footer-container').innerHTML = data; });
    </script>

    <div class="container">
        <div id="header-container"></div>

        <main class="main-content">
            <section class="main-section">
                <div class="LyricBody"> <!-- 歌词正文：整块居中，内部文字左对齐 -->
                    <div class="LyricProvenance">シングル「ターンＡターン」カップリング</div>

                    <div class="LyricTitle">月下美人</div>
                    <hr class="LyricDivider">

                    <div class="LyricPerformer">西城秀樹</div>

                    <div class="LyricText">
						<p>
							お嬢さん　お嬢さん<br>
							あなたひとりで　ふたりかも<br>
							陽ざしがつくる　ふくらみと<br>
							月のひかりの　もうひとり</p>
						<p>
							あなた行く道　ふたつでも<br>
							手をかしましょう　このぼくの<br>
							月のひかりの　うす化粧<br>
							重なる影に　恋心</p>
						<p>
							お嬢さん　お嬢さん<br>
							あなた抱いても　もうひとり<br>
							レェスのフリル　咲きほこる<br>
							月のひかりの　妖精が</p>
						<p>
							みぎとひだりに　飛んで行く<br>
							思いのたけを　つかまえて<br>
							こんやの月に　うつしだす<br>
							光のなかの　恋心</p>
						<p>
							あなたふたりの　ままですか<br>
							ぼくに任せて　みませんか<br>
							あらい浄めて　かがやかす<br>
							まどわされない　恋心</p>
                    </div>

                    <hr class="LyricFootRule">

                    <div class="LyricBack"><a href="0-gundam-index.html">← 曲目一覧</a></div>
                </div>
            </section>
        </main>

        <div id="footer-container"></div>
    </div>

</body>
</html>
