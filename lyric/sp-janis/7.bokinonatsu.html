<!DOCTYPE html> <!-- 声明文档类型为HTML5 -->

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- 响应式视口设置 -->
    <title>あの季節（なつ） - 塔ノ沢魔術研究会</title> <!-- 页面标题 -->
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/lyric/lyric.css?v=14">
    <link rel="icon" href="/image/logo.webp" type="image">
</head>

<body>
    <script>
        fetch('/components/header.html')
            .then(response => response.text())
            .then(data => { document.getElementById('header-container').innerHTML = data; });
        fetch('/components/footer.html')
            .then(response => response.text())
            .then(data => { document.getElementById('footer-container').innerHTML = data; });
    </script>

    <div class="container">
        <div id="header-container"></div>

        <main class="main-content">
            <section class="main-section">
                <div class="LyricBody"> <!-- 歌词正文：整块居中，内部文字左对齐 -->
                    <div class="LyricProvenance">ぼくのなつあそび挿入歌</div>

                    <div class="LyricTitle">あの季節（なつ）</div>
                    <hr class="LyricDivider">

                    <div class="LyricPerformer">樋口レン</div>
                    <div class="LyricStaff">作詞：河村好乃<br>作曲：平林征児<br>レコーディング：ソルシエール・サウンド・デザイン</div>

                    <div class="LyricText">
						<p>
							木枯らしが吹きぬけて<br>
							枯れ葉の雨に気が付けば<br>
							夏は扉硬く閉ざして<br>
							君の吐息白く揺れてた<br>
							駆け抜けてきたこの道と<br>
							なごりおしい夢の終わりに<br>
							過ぎた時を忘れないよう<br>
							強くその手握り締めたよ</p>
						<p>
							明日は一人じゃない<br>
							このさき君とふたり歩いてゆける<br>
							夢中で遊んだ夏の日々<br>
							そして時は移っても<br>
							熱い風をなびかせながら<br>
							きっと僕らを待っている<br>
							つぎの夏も</p>
                    </div>

                    <hr class="LyricFootRule">

                    <div class="LyricBack"><a href="0-sp-janis-index.html">← 曲目一覧</a></div>
                </div>
            </section>
        </main>

        <div id="footer-container"></div>
    </div>
