<!DOCTYPE html> <!-- 声明文档类型为HTML5 -->
<html lang="ja"> <!-- HTML根元素，设置语言为日文 -->
<head>
    <meta charset="UTF-8"> <!-- 设置字符编码为UTF-8 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- 响应式视口设置 -->
    <title>奇跡の海 - ロードス島戦記</title> <!-- 页面标题 -->
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/lyric/lyric.css?v=14">
    <link rel="icon" href="/image/logo.webp" type="image">
</head>

<body>
    <script>
        fetch('/components/header.html')
            .then(response => response.text())
            .then(data => { document.getElementById('header-container').innerHTML = data; });
        fetch('/components/footer.html')
            .then(response => response.text())
            .then(data => { document.getElementById('footer-container').innerHTML = data; });
    </script>

    <div class="container">
        <div id="header-container"></div>

        <main class="main-content">
            <section class="main-section">
                <div class="LyricBody"> <!-- 歌词正文：整块居中，内部文字左对齐 -->
                    <div class="LyricProvenance">「ロードス島戦記」オープニング</div>

                    <div class="LyricTitle">奇跡の海</div>
                    <hr class="LyricDivider">

                    <div class="LyricPerformer">坂本真綾</div>
                    <div class="LyricStaff">作詞：岩里祐穗<br>作曲・編曲：菅野よう子</div>

                    <div class="LyricText">
						<p>
							闇の夜空が二人分かつのわ<br>
							呼びあう心はだかにするため<br>
							飾り脱ぎ捨てすべてなくす時<br>
							何かが見える</p>
						<p>
							風よ私は立ち向かう<br>
							ゆこうくるしみの海えと<br>
							きずなこの胸にきざんで<br>
							砕ける波は果てなくとも</p>
						<p>
							なにをほとめて誰も争うの<br>
							流したちしお花を咲かせるの<br>
							とほとき明日この手にするまで<br>
							出会える日まで</p>
						<p>
							風よ私は立ち向かう<br>
							行こう輝きを目指して<br>
							祈りこの胸に抱きしめ<br>
							彷徨う闇のような未来</p>
						<p>
							風よ私は恐れない<br>
							愛こそ見つけ出した奇跡よ<br>
							君を信じてるよろこび<br>
							嵐は愛に築くために吹いてる</p>
                    </div>

                    <hr class="LyricFootRule">

                    <div class="LyricBack"><a href="0-lodoss-index.html">← 曲目一覧</a></div>
                </div>
            </section>
        </main>

        <div id="footer-container"></div>
    </div>

</body>
</html>
