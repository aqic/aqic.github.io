<!DOCTYPE html> <!-- 声明文档类型为HTML5 -->

<head>

    <title>星を空に… - テイルズ オブ ファンタジア</title> <!-- 页面标题 -->

    <link rel="stylesheet" href="/lyric/lyric.css?v=14">
    <link rel="icon" href="/image/logo.webp" type="image">
</head>

<body>
    <script>
        fetch('/components/header.html')
            .then(response => response.text())
            .then(data => { document.getElementById('header-container').innerHTML = data; });
        fetch('/components/footer.html')
            .then(response => response.text())
            .then(data => { document.getElementById('footer-container').innerHTML = data; });
    </script>

    <div class="container">
        <div id="header-container"></div>

        <main class="main-content">
            <section class="main-section">
                <div class="LyricBody"> <!-- 歌词正文：整块居中，内部文字左对齐 -->
                    <div class="LyricProvenance">「Tales of Phantasia」</div>

                    <div class="LyricTitle">星を空に…</div>
                    <hr class="LyricDivider">


                    <div class="LyricText">
						<p>
							何を見つめても美しく映るのに<br>
							君を見つめると切なさ隠せない<br>
							…ただ…ただ　途惑うばかり</p>
						<p>
							夜が優しさと寂しさを運ぶように<br>
							僕のこの胸にとどけられた思い<br>
							星に変えて君を照らすから</p>
						<p>
							ムーンライト幾つもの<br>
							溜息が囁く時<br>
							まだちさくて目立たない<br>
							星を空に飾らせて</p>
						<p>
							寂びた心さえときめきを懐かしむ<br>
							そっと手を当てて感じていた思い<br>
							胸を破り高く舞上がる</p>
						<p>
							ムーンライト少しだけ<br>
							この町を照らさないで<br>
							今　小さくて目立たない</p>
						<p>
							星を空に飾るから…<br>
							譬え築かれず<br>
							流れてもそれで良いよ</p>
						<p>
							ただ小さくて目立たない<br>
							星を空に飾らせて…</p>
                    </div>

                    <hr class="LyricFootRule">

                    <div class="LyricBack"><a href="0-tof-index.html">← 曲目一覧</a></div>
                </div>
            </section>

        <div id="footer-container"></div>
